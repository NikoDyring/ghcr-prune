name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: ShellCheck
        run: shellcheck prune.sh tests/*.sh

      - name: shfmt (formatting)
        run: |
          curl -fsSL -o /tmp/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          chmod +x /tmp/shfmt
          # -i 2: this project indents with two spaces. shfmt defaults to
          # tabs, which is a preference, not a correctness matter.
          /tmp/shfmt -i 2 --diff prune.sh tests/*.sh

      - name: action.yml is valid YAML
        run: python3 -c "import yaml; yaml.safe_load(open('action.yml'))"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both JSON parsers are supported, so both get tested. GitHub-hosted
        # runners have jq and python3; self-hosted often have neither, which
        # is exactly why the fallback exists.
        parser: [jq, python3]
        # Windows earns its place: on a Windows runner both jq and python
        # write stdout in text mode, so parser output arrives CRLF-terminated
        # and the stray carriage return rides along on the last field. That
        # silently broke the container manifest walk and a Linux-only matrix
        # could not see it. `shell: bash` here is Git Bash, which is what a
        # self-hosted Windows runner gives the action too.
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Input validation
        run: bash tests/validation.sh
        env:
          GHCR_PRUNE_JSON: ${{ matrix.parser }}

      - name: End-to-end against a fake API
        run: bash tests/fake-api.sh
        env:
          GHCR_PRUNE_JSON: ${{ matrix.parser }}

  # Proves the promise in the README: with no parser present the action fails
  # with a clear message instead of misbehaving.
  no-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fails cleanly when neither jq nor python3 exists
        run: |
          set -o pipefail
          out=$(GHCR_PRUNE_JSON=definitely-not-installed \
            INPUT_TOKEN=x INPUT_OWNER=someone INPUT_PACKAGE=thing \
            GITHUB_OUTPUT=/tmp/out \
            bash prune.sh 2>&1) && rc=0 || rc=$?

          echo "$out"
          [ "$rc" -ne 0 ] || { echo "expected a non-zero exit"; exit 1; }
          echo "$out" | grep -q 'Needs either jq or python3' \
            || { echo "expected the missing-parser error"; exit 1; }

  # Runs the action through action.yml rather than calling prune.sh directly,
  # so a broken input mapping or a missing exec bit can't slip through.
  #
  # This repo ships an action, not an image, so it has no container package —
  # meaning the run necessarily ends in the "package not found" path. That is
  # asserted explicitly below rather than waved through with
  # continue-on-error, which would make this job impossible to fail.
  #
  # What this covers: action.yml input wiring, the script being locatable and
  # runnable, owner-type detection, and the 404 error path.
  # What it does not: a successful prune. That needs a fixture package to
  # exist; see the note in CONTRIBUTING before adding one.
  wiring:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v5

      - id: prune
        uses: ./
        continue-on-error: true
        with:
          keep-last: 3
          dry-run: true

      - name: Assert the action ran and reported a missing package
        run: |
          outcome='${{ steps.prune.outcome }}'
          echo "step outcome: $outcome"

          if [ "$outcome" != "failure" ]; then
            echo "Expected the action to fail: this repo has no container package."
            echo "If that changed, this job needs rewriting into a real prune test."
            exit 1
          fi

          echo "action.yml wiring verified; the missing-package path reported cleanly."
